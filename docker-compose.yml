name: xom

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: xom
      POSTGRES_PASSWORD: xom
      POSTGRES_DB: xom
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xom -d xom"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
