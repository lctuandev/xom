<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf6b"/>
      <stop offset="0.55" stop-color="#f58a3c"/>
      <stop offset="1" stop-color="#d9412b"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset="0.7" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#ffe08a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8452f"/>
      <stop offset="1" stop-color="#8f2f20"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff2b0"/>
      <stop offset="1" stop-color="#f7b13b"/>
    </radialGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <!-- Mặt trời lặn sau mái nhà. -->
    <circle cx="330" cy="200" r="120" fill="url(#sun)"/>
    <circle cx="330" cy="200" r="62" fill="#fff1c4"/>
    <!-- Bụi tre làng bên trái: thân có đốt, lá thon. -->
