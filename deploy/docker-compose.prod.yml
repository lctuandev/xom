# Bản chạy thật trên máy nhà. Chỉ mở một cổng: web :5555 (Next proxy /api và /socket.io sang server).
# Sau này Cloudflare Tunnel trỏ thẳng vào http://localhost:5555.
name: xom-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: xom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?chạy deploy/deploy.sh để tạo deploy/.env}
      POSTGRES_DB: xom
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xom -d xom"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: .., dockerfile: deploy/Dockerfile, target: migrate }
    environment:
      DATABASE_URL: postgresql://xom:${POSTGRES_PASSWORD}@postgres:5432/xom
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  server:
    build: { context: .., dockerfile: deploy/Dockerfile, target: server }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://xom:${POSTGRES_PASSWORD}@postgres:5432/xom
      JWT_SECRET: ${JWT_SECRET:?chạy deploy/deploy.sh để tạo deploy/.env}
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      retries: 6

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
      args:
        API_ORIGIN: http://server:4000
    restart: unless-stopped
    ports:
      - "5555:3000"
    depends_on:
      server: { condition: service_healthy }

volumes:
  pgdata:
